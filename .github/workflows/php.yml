name: Bidboard PHP CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  php-quality-check:
    name: PHP Quality Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bidboard

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup PHP environment
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, pdo_mysql

      # Confirm PHP installation
      - name: Check PHP version
        run: php -v

      # Check PHP syntax errors
      - name: PHP Syntax Check
        run: |
          find . -name "*.php" -print0 | xargs -0 -r -n1 php -l

      # Verify important files exist
      - name: Verify Project Structure
        run: |
          test -f index.php
          test -f task.php
          test -f bid_status.php

          test -f includes/db.php
          test -f includes/auth_admin.php
          test -f includes/auth_client.php

          test -f sql/bidboard.sql

          test -d auth
          test -d client
          test -d admin
          test -d actions
          test -d includes
          test -d css

      # Detect accidental debugging code
      - name: Check Debug Statements
        run: |
          ! grep -R "var_dump(" --include="*.php" .
          ! grep -R "print_r(" --include="*.php" .

      # Check for exposed database credentials
      - name: Check Sensitive Files
        run: |
          ! find . -name ".env"
          ! find . -name "*.log"
